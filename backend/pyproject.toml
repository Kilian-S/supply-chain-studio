[project]
name = "scgame"
version = "0.1.0"
description = "Supply chain game simulation engine"
authors = [
    { name = "Kilian-S", email = "kxs25@ic.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "umap-learn>=0.5.12",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]
