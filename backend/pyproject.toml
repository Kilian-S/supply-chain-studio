[project]
name = "scgame"
version = "0.1.0"
description = "Supply chain game simulation engine"
authors = [
    { name = "Kilian-S", email = "kxs25@ic.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]
